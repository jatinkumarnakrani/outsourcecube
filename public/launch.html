<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cut the Ribbon</title>
<style>
  :root{
    --navy:#0B1B2B;
    --navy-deep:#071220;
    --gold:#C9A227;
    --gold-bright:#EFD27A;
    --cream:#F3ECDC;
    --red:#A62F2F;
    --red-dark:#7A2020;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;height:100%;
    background: radial-gradient(circle at 50% 15%, #16304d 0%, var(--navy) 45%, var(--navy-deep) 100%);
    color:var(--cream);
    font-family:'Helvetica Neue', Arial, sans-serif;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }
  .wrap{
    text-align:center;
    width:100%;
    max-width:680px;
    padding:32px;
  }
  .eyebrow{
    font-family:Georgia, serif;
    font-style:italic;
    letter-spacing:0.05em;
    font-size:16px;
    color:var(--gold-bright);
    margin-bottom:6px;
  }
  h1{
    font-family:Georgia, serif;
    font-weight:400;
    font-size:clamp(28px,5vw,46px);
    margin:0 0 8px;
  }
  p.sub{
    font-size:14px;
    color:#B9C3D0;
    max-width:420px;
    margin:0 auto 48px;
    line-height:1.6;
  }

  /* Ribbon scene */
  .scene{
    position:relative;
    height:180px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:36px;
  }
  .pole{
    position:absolute;
    top:10px; bottom:10px;
    width:6px;
    background:linear-gradient(180deg, var(--gold-bright), var(--gold));
    border-radius:3px;
  }
  .pole.left{left:14%;}
  .pole.right{right:14%;}
  .pole::before{
    content:'';
    position:absolute; top:-8px; left:50%; transform:translateX(-50%);
    width:20px;height:20px;border-radius:50%;
    background:var(--gold-bright);
    box-shadow:0 0 12px rgba(233,199,102,0.6);
  }

  .ribbon-half{
    position:absolute; top:50%;
    width:36%;
    height:56px;
    margin-top:-28px;
    background:linear-gradient(180deg, #C24545, var(--red) 45%, var(--red-dark));
    box-shadow: 0 6px 18px rgba(0,0,0,0.35);
    transition: transform 1.1s cubic-bezier(.55,-0.1,.4,1.4), opacity 1.1s ease;
  }
  .ribbon-half::after{
    content:'';
    position:absolute; inset:0;
    background: repeating-linear-gradient(90deg, rgba(255,255,255,0.10) 0 3px, transparent 3px 14px);
  }
  .ribbon-half.l{ left:16%; border-radius:4px 0 0 4px; }
  .ribbon-half.r{ right:16%; border-radius:0 4px 4px 0; }

  .knot{
    position:absolute; top:50%; left:50%;
    width:64px; height:64px; margin:-32px 0 0 -32px;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, var(--gold-bright), var(--gold) 70%);
    box-shadow: 0 0 24px rgba(201,162,39,0.55);
    display:flex; align-items:center; justify-content:center;
    z-index:3;
    transition: transform 0.5s ease, opacity 0.5s ease;
  }
  .knot svg{ width:30px; height:30px; }

  .scissors{
    position:absolute; top:50%; left:50%;
    width:70px; height:70px;
    margin:-58px 0 0 -35px;
    transform-origin:70% 70%;
    z-index:4;
    filter:drop-shadow(0 4px 8px rgba(0,0,0,0.4));
    cursor:pointer;
    transition: transform 0.25s ease;
  }
  .scissors:hover{ transform: scale(1.06) rotate(-4deg); }
  .scissors.snip{ animation: snipMove 0.5s ease; }
  @keyframes snipMove{
    0%{ transform:rotate(0deg); }
    45%{ transform:rotate(22deg); }
    100%{ transform:rotate(0deg); }
  }

  .cut .ribbon-half.l{ transform: translate(-40px, 60px) rotate(-14deg); opacity:0; }
  .cut .ribbon-half.r{ transform: translate(40px, 60px) rotate(14deg); opacity:0; }
  .cut .knot{ transform: scale(0); opacity:0; }
  .cut .scissors{ opacity:0; pointer-events:none; }

  button.cta{
    font-family:'Helvetica Neue', Arial, sans-serif;
    font-size:13px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    background:transparent;
    color:var(--gold-bright);
    border:1px solid var(--gold);
    padding:14px 30px;
    border-radius:999px;
    cursor:pointer;
    transition: background 0.25s ease, color 0.25s ease;
  }
  button.cta:hover{ background:var(--gold); color:var(--navy-deep); }
  button.cta:disabled{ opacity:0.5; cursor:default; }
  button.cta:disabled:hover{ background:transparent; color:var(--gold-bright); }

  .hint{
    margin-top:14px;
    font-size:12px;
    color:#8FA0B4;
    min-height:16px;
  }

  /* Confetti + reveal */
  .confetti-piece{
    position:fixed; top:-20px;
    width:8px; height:14px;
    opacity:0.95;
    z-index:5;
    animation-name: fall;
    animation-timing-function: linear;
    animation-fill-mode: forwards;
  }
  @keyframes fall{
    to{ transform: translateY(110vh) rotate(540deg); opacity:0.9; }
  }

  .reveal{
    display:none;
  }
  .reveal.show{ display:block; animation: fadeUp 0.7s ease forwards; }
  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(14px);}
    to{ opacity:1; transform:translateY(0);}
  }
  .reveal h2{
    font-family:Georgia, serif; font-weight:400;
    font-size:clamp(24px,4vw,34px);
    margin:0 0 10px;
    color:var(--gold-bright);
  }
  .reveal p{ color:#B9C3D0; font-size:14px; margin-bottom:28px; }
  a.go-live{
    display:inline-block;
    font-size:13px; letter-spacing:0.12em; text-transform:uppercase;
    background:var(--gold);
    color:var(--navy-deep);
    text-decoration:none;
    padding:15px 34px;
    border-radius:999px;
    font-weight:bold;
    box-shadow: 0 8px 24px rgba(201,162,39,0.35);
  }
</style>
</head>
<body>

<div class="wrap">
  <div id="pre">
    <div class="eyebrow">You have the honor of the</div>
    <h1>First Cut</h1>
    <p class="sub">This link exists for one person only. When you're ready, cut the ribbon &mdash; the site goes live for everyone the moment you do.</p>

    <div class="scene" id="scene">
      <div class="pole left"></div>
      <div class="pole right"></div>
      <div class="ribbon-half l"></div>
      <div class="ribbon-half r"></div>
      <div class="knot">
        <svg viewBox="0 0 24 24" fill="none" stroke="#3a2d05" stroke-width="1.4"><circle cx="12" cy="12" r="9"/></svg>
      </div>
      <div class="scissors" id="scissors" title="Click to cut">
        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="14" cy="14" r="8" stroke="#EFD27A" stroke-width="3"/>
          <circle cx="14" cy="46" r="8" stroke="#EFD27A" stroke-width="3"/>
          <path d="M20 18L54 50" stroke="#EFD27A" stroke-width="3" stroke-linecap="round"/>
          <path d="M20 42L54 10" stroke="#EFD27A" stroke-width="3" stroke-linecap="round"/>
        </svg>
      </div>
    </div>

    <button class="cta" id="cutBtn">Cut the Ribbon</button>
    <div class="hint" id="hint"></div>
  </div>

  <div class="reveal" id="reveal">
    <h2>🎉 It's open.</h2>
    <p>You just launched it &mdash; the site is now live for everyone.</p>
    <a class="go-live" href="/jatin">View the Live Site</a>
  </div>
</div>

<script>
  const scissors = document.getElementById('scissors');
  const scene = document.getElementById('scene');
  const cutBtn = document.getElementById('cutBtn');
  const hint = document.getElementById('hint');
  const pre = document.getElementById('pre');
  const reveal = document.getElementById('reveal');
  let cutDone = false;

  function confettiBurst(){
    const colors = ['#C9A227','#EFD27A','#A62F2F','#F3ECDC','#7A2020'];
    for(let i=0;i<80;i++){
      const el = document.createElement('div');
      el.className = 'confetti-piece';
      el.style.left = Math.random()*100 + 'vw';
      el.style.background = colors[Math.floor(Math.random()*colors.length)];
      el.style.animationDuration = (2.5 + Math.random()*2) + 's';
      el.style.animationDelay = (Math.random()*0.4) + 's';
      document.body.appendChild(el);
      setTimeout(()=>el.remove(), 5000);
    }
  }

  async function doCut(){
    if(cutDone) return;
    cutDone = true;
    cutBtn.disabled = true;
    scissors.classList.add('snip');

    setTimeout(async ()=>{
      scene.classList.add('cut');
      confettiBurst();

      // Tell the server the site is now live.
      try{
        hint.textContent = 'Opening the doors…';
        const res = await fetch('../create-flag.php', { method:'POST' });
        if(!res.ok) throw new Error('bad response');
        hint.textContent = '';
      }catch(e){
        hint.textContent = "Ribbon's cut — but the server switch didn't respond. Flip it manually if needed.";
      }

      setTimeout(()=>{
        pre.style.display = 'none';
        reveal.classList.add('show');
      }, 700);
    }, 350);
  }

  scissors.addEventListener('click', doCut);
  cutBtn.addEventListener('click', doCut);
</script>

</body>
</html>
